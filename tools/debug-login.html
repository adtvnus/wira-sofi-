<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔐 Wedding Invitation Login Debug</h1>
    
    <div>
        <h3>Test API Connection:</h3>
        <button onclick="testHealth()">Test Health Check</button>
        <button onclick="testLogin()">Test Login (admin/admin)</button>
        <button onclick="testAllCredentials()">Test All Credentials</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        const resultsDiv = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        async function testHealth() {
            addResult('🏥 Testing API Health Check...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Health Check Success: ${JSON.stringify(data)}`, 'success');
                } else {
                    addResult(`❌ Health Check Failed: ${response.status} - ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Health Check Error: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            addResult('🔐 Testing Login with admin/admin...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin'
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    addResult(`✅ Login Success: Token=${data.token?.substring(0, 30)}..., User=${data.user?.fullName}`, 'success');
                } else {
                    addResult(`❌ Login Failed: ${response.status} - ${data.error || JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Login Error: ${error.message}`, 'error');
            }
        }

        async function testAllCredentials() {
            const credentials = [
                { username: 'admin', password: 'admin' },
                { username: 'admin', password: 'admin123' },
                { username: 'wira', password: 'wira123' },
                { username: 'sofi', password: 'sofi123' },
                { username: 'demo', password: '123' }
            ];

            addResult('🔄 Testing all credentials...', 'info');

            for (const cred of credentials) {
                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(cred)
                    });

                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        addResult(`✅ ${cred.username}/${cred.password}: SUCCESS - ${data.user?.fullName}`, 'success');
                    } else {
                        addResult(`❌ ${cred.username}/${cred.password}: FAILED - ${data.error || 'Unknown error'}`, 'error');
                    }
                } catch (error) {
                    addResult(`❌ ${cred.username}/${cred.password}: ERROR - ${error.message}`, 'error');
                }
                
                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        // Auto-test on page load
        window.onload = function() {
            addResult('🚀 Debug page loaded. Backend should be running on http://localhost:3001', 'info');
            addResult('📝 Database seeded with admin users: admin/admin, wira/wira123, sofi/sofi123, demo/123', 'info');
            testHealth();
        };
    </script>
</body>
</html>
